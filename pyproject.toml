[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entropyaudit"
version = "1.0.0"
description = "Static auditor for randomness and nonce hygiene in Python source."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EntropyAudit contributors" }]
keywords = ["security", "static-analysis", "randomness", "ast"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/chuangtian/EntropyAudit"
Repository = "https://github.com/chuangtian/EntropyAudit"

[project.scripts]
