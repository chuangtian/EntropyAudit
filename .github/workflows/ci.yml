name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python (compile, tests, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q src
      - name: Tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Smoke run on the clean sample
        run: PYTHONPATH=src python -m entropyaudit scan samples/clean_auth.py

